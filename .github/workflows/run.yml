name: 刷步数
on:
  schedule:
    - cron: '30 13 30 * *' # UTC13:30 = 北京时间21:30，每月1~23号执行
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: 开始
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 main.py
      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          # 文件无变更直接跳过提交推送，避免git冲突报错
          if ! git diff --cached --quiet; then
              git commit -m "persist tokens trigger by ${{ github.event_name }}"
              git pull --rebase origin master
              git push origin master
          else
              echo "无文件变更，跳过提交推送"
          fi
